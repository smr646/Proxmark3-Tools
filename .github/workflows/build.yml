name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configure Android SDK Environment
      run: |
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

    - name: Patch AGP Version for Gradle 8+ Compatibility
      run: |
        find . -name "build.gradle" -o -name "build.gradle.kts" | xargs sed -i 's/7\.[0-9]\+\.[0-9]\+/8.1.1/g'
        find . -name "build.gradle" -o -name "build.gradle.kts" | xargs sed -i 's/8\.0\.[0-9]\+/8.1.1/g'

    - name: Install Gradle 8.5 Manually
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        sudo rm -rf /opt/gradle
        sudo mkdir -p /opt/gradle
        sudo mv gradle-8.5/* /opt/gradle/
        /opt/gradle/bin/gradle --version

    - name: Build Debug APK
      run: /opt/gradle/bin/gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
